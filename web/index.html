<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Vertex Edge - Vertex İç Yönetim Paneli. Görev yönetimi ve ekip iletişimi.">
  <meta name="author" content="Vertex Corporation">
  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vertex Edge">
  <meta property="og:description" content="Vertex İç Yönetim Paneli">
  <meta property="og:site_name" content="Vertex Corporation">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vertex Edge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vertex Edge</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="manifest" href="manifest.json">

  <!-- Vertex Dark Background (prevent white flash) -->
  <style>
    html, body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* Loading indicator */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
    }

    .loading-logo {
      width: 100px;
      height: 100px;
      position: relative;
      background: url('icons/Icon-192.png') no-repeat center;
      background-size: contain;
      opacity: 0.3;
    }

    .loading-shimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100px;
      height: 100px;
      background: linear-gradient(90deg, 
        rgba(255, 255, 255, 0) 0%, 
        rgba(255, 255, 255, 0.8) 50%, 
        rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
      -webkit-mask-image: url('icons/Icon-192.png');
      -webkit-mask-size: contain;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-image: url('icons/Icon-192.png');
      mask-size: contain;
      mask-position: center;
      mask-repeat: no-repeat;
      animation: shimmer 2s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div style="position: relative;">
      <div class="loading-logo"></div>
      <div class="loading-shimmer"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });

    function isOAuthReturn() {
      var href = window.location.href;
      if (href.indexOf('__/auth/') !== -1) return true;
      var q = window.location.search || '';
      return /[?&](apiKey|mode|oobCode|code|state)=/.test(q);
    }

    function clearStaleCaches() {
      if (isOAuthReturn()) return;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).catch(function () {});
      }
    }

    // Don't wipe caches before Firebase redirect sign-in completes (Safari ITP).
    if (!isOAuthReturn()) {
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(clearStaleCaches, 8000);
      });
    }

    // Fallback if Flutter fails to boot on slow mobile networks
    setTimeout(function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.innerHTML =
        '<div style="color:#aaa;font-family:sans-serif;text-align:center;padding:24px;">' +
        '<p style="font-size:16px;margin-bottom:12px;">Yüklenemedi</p>' +
        '<button onclick="location.reload()" style="padding:10px 24px;border-radius:8px;' +
        'border:none;background:#0072FF;color:#fff;font-size:14px;cursor:pointer;">Yeniden Dene</button>' +
        '</div>';
    }, 25000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
