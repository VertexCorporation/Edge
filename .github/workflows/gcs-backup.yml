name: Centralized Org Backup to GCS

on:
  schedule:
    # Run every day at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Backup Frequency Type
        id: backup_type
        run: |
          TYPE="daily"
          
          # If today is the 1st of the month, classify as monthly
          if [ "$(date +%d)" = "01" ]; then
            TYPE="monthly"
          # If it's Sunday (0) AND the week number is even, classify as biweekly
          elif [ "$(date +%w)" = "0" ] && [ $(( $(date +%V) % 2 )) -eq 0 ]; then
            TYPE="biweekly"
          fi
          
          echo "TYPE=$TYPE" >> $GITHUB_OUTPUT
          echo "Determined backup type: $TYPE"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Backup All Organization Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_PAT }}
          BUCKET: "gs://github-organization"
          PREFIX: "${{ steps.backup_type.outputs.TYPE }}"
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M-%S')
          
          # Fetch all repositories for VertexCorporation
          echo "Fetching repositories for VertexCorporation..."
          REPOS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/orgs/VertexCorporation/repos?type=all&per_page=100" | jq -r '.[].full_name')
          
          if [ -z "$REPOS" ] || [ "$REPOS" = "null" ]; then
            echo "Error: Could not fetch repositories. Please check ORG_PAT."
            exit 1
          fi
          
          for REPO in $REPOS; do
            REPO_NAME=$(basename $REPO)
            echo "----------------------------------------"
            echo "Starting backup for: $REPO_NAME"
            echo "----------------------------------------"
            
            # Clone repository fully
            git clone --mirror "https://${GITHUB_TOKEN}@github.com/${REPO}.git" "${REPO_NAME}.git"
            
            # Navigate inside and create bundle
            cd "${REPO_NAME}.git"
            BUNDLE_NAME="${REPO_NAME}_${DATE}.bundle"
            git bundle create "../${BUNDLE_NAME}" --all
            cd ..
            
            # Upload bundle to GCS
            gsutil cp "${BUNDLE_NAME}" "${BUCKET}/${PREFIX}/${BUNDLE_NAME}"
            
            # Cleanup space
            rm -rf "${REPO_NAME}.git" "${BUNDLE_NAME}"
            
            echo "Successfully backed up $REPO_NAME to GCS."
          done
